<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Colaborativa & Meet</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <!-- Socket.IO Client -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="room-body">

  <!-- BARRA SUPERIOR -->
  <header class="room-header">
    <div class="header-left">
      <a href="/" class="header-logo" title="Volver al inicio">
        <span class="logo-icon">🎨</span>
        <span class="logo-text">Pizarra <strong>Meet</strong></span>
      </a>
      <div class="room-tag">
        <span class="tag-label">SALA:</span>
        <span id="room-code-badge" class="tag-code">cargando...</span>
        <button id="btn-copy-link" class="btn-icon" title="Copiar enlace para otra PC">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="btn-text">Copiar enlace</span>
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="ip-info-pill" id="header-ip-info" title="Dirección para abrir desde otra computadora">
        <span class="pulse-dot"></span>
        <span id="lan-ip-text">Detectando IP de red...</span>
      </div>

      <div class="users-badge" id="users-badge" title="Participantes en la sala">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span id="user-count">1</span>
      </div>
    </div>
  </header>

  <div id="secure-banner" class="secure-banner" hidden>
    Cámara y micrófono no funcionan por HTTP en otra computadora.
    Abre <a id="secure-link" href="#"></a> y acepta el aviso del certificado.
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="room-main">
    
    <!-- ÁREA DE LA PIZARRA CANVAS -->
    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="whiteboard"></canvas>
      <!-- Capa de cursores de otros usuarios -->
      <div id="cursor-layer" class="cursor-layer"></div>
    </div>

    <!-- PANEL FLOTANTE DE VIDEOLLAMADA (ESTILO GOOGLE MEET) -->
    <aside class="meet-panel" id="meet-panel">
      <div class="meet-panel-header">
        <div class="meet-title">
          <span class="meet-icon">📹</span>
          <span>Videollamada Meet</span>
        </div>
        <div class="meet-actions">
          <button id="btn-toggle-panel" class="btn-icon-sm" title="Minimizar / Expandir">
            <svg id="minimize-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline></svg>
          </button>
        </div>
      </div>

      <!-- Cuadrícula de participantes -->
      <div class="video-grid" id="video-grid">
        <!-- Video Local -->
        <div class="video-tile local-tile" id="local-video-box">
          <video id="local-video" autoplay playsinline muted></video>
          <div class="video-placeholder" id="local-placeholder">
            <div class="user-avatar" id="local-avatar">Tú</div>
          </div>
          <div class="video-footer">
            <span class="user-name" id="local-user-label">Tú</span>
            <div class="audio-indicator" id="local-audio-indicator">🎤</div>
          </div>
        </div>

        <!-- Los videos remotos se inyectan dinámicamente aquí -->
      </div>

      <!-- Barra de controles de la llamada estilo Google Meet -->
      <div class="meet-controls">
        <button id="btn-toggle-mic" class="meet-btn off" title="Activar / Desactivar Micrófono">
          <svg class="icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          <svg class="icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>

        <button id="btn-toggle-cam" class="meet-btn off" title="Activar / Desactivar Cámara">
          <svg class="icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <svg class="icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M21 21l-5-5-2 2-7-7-2-2"></path><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"></path><polygon points="23 7 16 12 23 17 23 7"></polygon></svg>
        </button>

        <button id="btn-toggle-screen" class="meet-btn" title="Compartir Pantalla">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </button>
      </div>
      <p id="media-status" class="media-status" aria-live="polite">Preparando cámara y micrófono…</p>
    </aside>

    <!-- BARRA DE HERRAMIENTAS FLOTANTE DE LA PIZARRA -->
    <div class="toolbar-dock" id="toolbar">
      
      <!-- Herramientas -->
      <div class="tool-group">
        <button class="tool-btn active" id="tool-pen" data-tool="pen" title="Pincel / Lápiz">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
        </button>

        <button class="tool-btn" id="tool-line" data-tool="line" title="Línea recta">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
        </button>

        <button class="tool-btn" id="tool-rect" data-tool="rect" title="Rectángulo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        </button>

        <button class="tool-btn" id="tool-circle" data-tool="circle" title="Círculo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>
        </button>

        <button class="tool-btn" id="tool-eraser" data-tool="eraser" title="Borrador">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L18 15"></path><path d="M18 15l-6-6"></path></svg>
        </button>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Paleta de colores -->
      <div class="color-palette">
        <button class="color-swatch active" data-color="#1e1e1e" style="background: #1e1e1e;"></button>
        <button class="color-swatch" data-color="#1a73e8" style="background: #1a73e8;"></button>
        <button class="color-swatch" data-color="#ea4335" style="background: #ea4335;"></button>
        <button class="color-swatch" data-color="#34a853" style="background: #34a853;"></button>
        <button class="color-swatch" data-color="#fbbc04" style="background: #fbbc04;"></button>
        <button class="color-swatch" data-color="#9334e8" style="background: #9334e8;"></button>
        
        <label class="color-custom" title="Color personalizado">
          <input type="color" id="custom-color-picker" value="#1e1e1e">
          <span class="custom-color-icon">🎨</span>
        </label>
      </div>

      <div class="toolbar-separator"></div>

      <!-- Grosor de trazo -->
      <div class="brush-size-control" title="Grosor de trazo">
        <span class="size-preview" id="size-preview-dot"></span>
        <input type="range" id="brush-size" min="2" max="36" value="4">
      </div>

      <div class="toolbar-separator"></div>

      <!-- Acciones -->
      <div class="action-group">
        <button class="action-btn" id="btn-undo" title="Deshacer último trazo local">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
        </button>

        <button class="action-btn danger" id="btn-clear-board" title="Limpiar pizarra (para todos)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>

        <button class="action-btn" id="btn-download-image" title="Guardar como imagen PNG">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>
      </div>

    </div>

  </main>

  <!-- Notificación Toast -->
  <div id="toast" class="toast">Mensaje</div>

  <!-- Scripts -->
  <script src="/js/whiteboard.js"></script>
  <script src="/js/webrtc.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
